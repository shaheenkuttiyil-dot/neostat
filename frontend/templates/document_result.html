<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ document_name }} — Result</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1><a href="/" class="back-link">&larr; Dashboard</a> / {{ document_name }}</h1>
  </header>

  <main class="container">
    <section class="card" id="summary-card">Loading…</section>

    <section class="card">
      <h2>Extracted Fields</h2>
      <div id="fields-container"></div>
    </section>

    <section class="card">
      <h2>Line Items</h2>
      <div id="line-items-container"></div>
    </section>

    <section class="card">
      <h2>Financial Validation</h2>
      <div id="validation-container"></div>
    </section>

    <section class="card">
      <h2>Raw JSON</h2>
      <button id="toggle-json-btn">Show / Hide Raw JSON</button>
      <pre id="raw-json" style="display:none;"></pre>
    </section>
  </main>

  <script>const DOCUMENT_NAME = {{ document_name | tojson }};</script>
  <script src="/static/js/detail.js"></script>
</body>
</html>
