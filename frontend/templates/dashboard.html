<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Intelligence Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Document Intelligence Platform</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Process a Document</h2>
      <form id="upload-form">
        <label>Document Type
          <select id="document_type" required>
            <option value="invoice">Invoice</option>
            <option value="balance_sheet">Balance Sheet</option>
            <option value="profit_and_loss">Profit &amp; Loss</option>
            <option value="cash_flow_statement">Cash Flow Statement</option>
          </select>
        </label>
        <label>File (PDF / JPG / PNG, max 3 pages)
          <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png" required>
        </label>
        <button type="submit" id="submit-btn">Process</button>
      </form>
      <div id="upload-status"></div>
    </section>

    <section class="card">
      <h2>Processed Documents</h2>
      <table id="doc-table">
        <thead>
          <tr><th>Document Name</th><th>Type</th><th>Status</th><th>Processed At</th></tr>
        </thead>
        <tbody id="doc-table-body">
          <tr><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
