<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">

  {% include "_sidebar.html" %}

  <main class="main">
    <a id="upload" name="upload"></a>
    <h1>Process a document</h1>
    <p class="lede">Select the document type and upload a PDF, JPG, or PNG (max 3 pages).</p>

    <form id="upload-form">
      <p class="section-label">1. Document type</p>
      <div class="type-grid" id="typeGrid">
        <button type="button" class="type-card selected" data-value="invoice">
          <div class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg></div>
          <div>
            <p class="type-title">Invoice</p>
            <p class="type-desc">Vendor invoices with line items</p>
          </div>
        </button>
        <button type="button" class="type-card" data-value="balance_sheet">
          <div class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 8l-2 5a4 4 0 0 0 8 0l-2-5"/><path d="M21 8l-2 5a4 4 0 0 0 8 0l-2-5"/><path d="M5 8h14"/></svg></div>
          <div>
            <p class="type-title">Balance Sheet</p>
            <p class="type-desc">Assets, liabilities &amp; equity</p>
          </div>
        </button>
        <button type="button" class="type-card" data-value="profit_and_loss">
          <div class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></div>
          <div>
            <p class="type-title">Profit &amp; Loss</p>
            <p class="type-desc">Income &amp; expense statement</p>
          </div>
        </button>
        <button type="button" class="type-card" data-value="cash_flow_statement">
          <div class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg></div>
          <div>
            <p class="type-title">Cash Flow</p>
            <p class="type-desc">Operating, investing &amp; financing</p>
          </div>
        </button>
      </div>
      <select id="document_type" style="display:none;" required>
        <option value="invoice">Invoice</option>
        <option value="balance_sheet">Balance Sheet</option>
        <option value="profit_and_loss">Profit &amp; Loss</option>
        <option value="cash_flow_statement">Cash Flow Statement</option>
      </select>

      <p class="section-label">2. Upload document</p>
      <div id="uploadArea">
        <label class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
          <p class="drop-title">Drop a document here, or click to browse</p>
          <p class="drop-sub">PDF, JPG, or PNG &middot; up to 3 pages</p>
          <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png" required>
        </label>
      </div>

      <div class="bottom-row">
        <div class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 4.1L6 9l4.1 1.9L12 15l1.9-4.1L18 9l-4.1-1.9z"/></svg>
          Extraction runs AI vision + OCR, then validates financial relationships.
        </div>
        <button type="submit" class="cta" id="submit-btn" disabled>Extract &amp; Validate</button>
      </div>

      <div id="upload-status"></div>
    </form>


  </main>
</div>

<script src="/static/js/upload.js"></script>
</body>
</html>
